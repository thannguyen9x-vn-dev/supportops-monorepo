services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supportops}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-supportops}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - supportops_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - supportops_net

  api:
    image: ${API_IMAGE:-ghcr.io/your-org/supportops-api:local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 8081
      CORS_ALLOWED_ORIGIN: ${APP_ORIGIN}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-supportops}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-604800}
      WEB_APP_BASE_URL: ${APP_ORIGIN}
      FILE_PUBLIC_BASE_URL: ${API_ORIGIN}/storage
      FILE_SIGNING_SECRET: ${FILE_SIGNING_SECRET}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-resend}
      MAIL_DAILY_LIMIT: ${MAIL_DAILY_LIMIT:-90}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-onboarding@resend.dev}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-SupportOps}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - supportops_net

  web:
    image: ${WEB_IMAGE:-ghcr.io/your-org/supportops-web:local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: ${API_ORIGIN}/api/v1
      BACKEND_INTERNAL_URL: http://api:8081/api/v1
      API_INTERNAL_URL: http://api:8081/api/v1
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - supportops_net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./deploy/nginx/templates:/etc/nginx/templates:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      - ./deploy/nginx/www:/var/www/certbot:ro
    networks:
      - supportops_net

volumes:
  postgres_data:
  redis_data:

networks:
  supportops_net:
    driver: bridge
