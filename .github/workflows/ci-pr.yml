name: CI Pull Request

on:
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Generate Prisma client (api)
        run: pnpm --filter @supportops/api prisma:generate

      - name: Build types package
        run: pnpm --filter @supportops/types build

      - name: Typecheck
        run: |
          pnpm typecheck
          pnpm --filter @supportops/web typecheck
          pnpm --filter @supportops/api typecheck

      - name: Test
        run: pnpm -r --if-present test

      - name: Build shared UI packages
        run: |
          pnpm --filter @supportops/ui-avatar build
          pnpm --filter @supportops/ui-dialog build
          pnpm --filter @supportops/ui-file-upload build
          pnpm --filter @supportops/ui-form build
          pnpm --filter @supportops/ui-theme build
          pnpm --filter @supportops/ui build

      - name: Build web
        run: pnpm --filter @supportops/web build

      - name: Build api
        run: pnpm --filter @supportops/api build

  ai-service-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ai-service dependencies
        run: |
          cd apps/ai-service
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run ai-service tests with coverage gate
        run: |
          cd apps/ai-service
          START_TS=$(date +%s)
          pytest -q --cov=. --cov-report=term-missing --cov-fail-under=80
          END_TS=$(date +%s)
          DURATION=$((END_TS - START_TS))
          echo "## AI Service pytest runtime" >> "$GITHUB_STEP_SUMMARY"
          echo "- Duration: ${DURATION}s (target: <10s)" >> "$GITHUB_STEP_SUMMARY"
