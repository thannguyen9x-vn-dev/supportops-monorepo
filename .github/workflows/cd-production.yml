name: CD Production

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy (e.g. v1.2.3)'
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  WEB_IMAGE_NAME: ${{ github.repository_owner }}/supportops-web
  API_IMAGE_NAME: ${{ github.repository_owner }}/supportops-api
  PORTFOLIO_IMAGE_NAME: ${{ github.repository_owner }}/supportops-portfolio

jobs:
  build-web:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache turbo build artifacts
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-web-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-web-

      - name: Set image name
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "image=${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:prod-latest
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.PROD_API_ORIGIN }}/api/v1
          cache-from: type=gha,scope=web-prod
          cache-to: type=gha,mode=max,scope=web-prod

  build-api:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache turbo build artifacts
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-api-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-api-

      - name: Set image name
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "image=${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:prod-latest
          cache-from: type=gha,scope=api-prod
          cache-to: type=gha,mode=max,scope=api-prod

  build-portfolio:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache turbo build artifacts
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-portfolio-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-portfolio-

      - name: Set image name
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "image=${{ env.REGISTRY }}/${{ env.PORTFOLIO_IMAGE_NAME }}:${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Build and push portfolio image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/portfolio/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.REGISTRY }}/${{ env.PORTFOLIO_IMAGE_NAME }}:prod-latest
          cache-from: type=gha,scope=portfolio-prod
          cache-to: type=gha,mode=max,scope=portfolio-prod

  deploy:
    runs-on: ubuntu-latest
    needs: [build-web, build-api, build-portfolio]
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy deploy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: "docker-compose.prod.yml,deploy/nginx/templates/supportops.conf.template,deploy/deploy-prod.sh,deploy/smoke-test.sh,deploy/init-letsencrypt.sh"
          target: ${{ secrets.PROD_DEPLOY_PATH }}
          strip_components: 0
          overwrite: true

      - name: Deploy to production
        uses: appleboy/ssh-action@v1.2.0
        env:
          WEB_IMAGE: ${{ needs.build-web.outputs.image }}
          API_IMAGE: ${{ needs.build-api.outputs.image }}
          PORTFOLIO_IMAGE: ${{ needs.build-portfolio.outputs.image }}
          PORTFOLIO_DOMAIN: ${{ secrets.PROD_PORTFOLIO_DOMAIN }}
          APP_DOMAIN: ${{ secrets.PROD_APP_DOMAIN }}
          API_DOMAIN: ${{ secrets.PROD_API_DOMAIN }}
          APP_ORIGIN: ${{ secrets.PROD_APP_ORIGIN }}
          API_ORIGIN: ${{ secrets.PROD_API_ORIGIN }}
          POSTGRES_DB: ${{ secrets.PROD_POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.PROD_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
          FILE_SIGNING_SECRET: ${{ secrets.PROD_FILE_SIGNING_SECRET }}
          GHCR_USERNAME: ${{ secrets.PROD_GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.PROD_GHCR_TOKEN }}
          MAIL_ENABLED: ${{ secrets.PROD_MAIL_ENABLED }}
          MAIL_PROVIDER: ${{ secrets.PROD_MAIL_PROVIDER }}
          MAIL_DAILY_LIMIT: ${{ secrets.PROD_MAIL_DAILY_LIMIT }}
          MAIL_FROM_EMAIL: ${{ secrets.PROD_MAIL_FROM_EMAIL }}
          MAIL_FROM_NAME: ${{ secrets.PROD_MAIL_FROM_NAME }}
          RESEND_API_KEY: ${{ secrets.PROD_RESEND_API_KEY }}
          REDIS_PASSWORD: ${{ secrets.PROD_REDIS_PASSWORD }}
          LOG_LEVEL: ${{ secrets.PROD_LOG_LEVEL }}
          AUDIT_LOG_RETENTION_DAYS: ${{ secrets.PROD_AUDIT_LOG_RETENTION_DAYS }}
          ERROR_ALERT_THRESHOLD: ${{ secrets.PROD_ERROR_ALERT_THRESHOLD }}
          ERROR_ALERT_WINDOW_MS: ${{ secrets.PROD_ERROR_ALERT_WINDOW_MS }}
          ERROR_ALERT_COOLDOWN_MS: ${{ secrets.PROD_ERROR_ALERT_COOLDOWN_MS }}
          ERROR_ALERT_WEBHOOK_URL: ${{ secrets.PROD_ERROR_ALERT_WEBHOOK_URL }}
          CERTBOT_EMAIL: ${{ secrets.PROD_CERTBOT_EMAIL }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: WEB_IMAGE,API_IMAGE,PORTFOLIO_IMAGE,PORTFOLIO_DOMAIN,APP_DOMAIN,API_DOMAIN,APP_ORIGIN,API_ORIGIN,POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,JWT_SECRET,FILE_SIGNING_SECRET,GHCR_USERNAME,GHCR_TOKEN,MAIL_ENABLED,MAIL_PROVIDER,MAIL_DAILY_LIMIT,MAIL_FROM_EMAIL,MAIL_FROM_NAME,RESEND_API_KEY,REDIS_PASSWORD,LOG_LEVEL,AUDIT_LOG_RETENTION_DAYS,ERROR_ALERT_THRESHOLD,ERROR_ALERT_WINDOW_MS,ERROR_ALERT_COOLDOWN_MS,ERROR_ALERT_WEBHOOK_URL,CERTBOT_EMAIL
          script_stop: true
          script: |
            set -Eeuo pipefail
            DEPLOY_PATH="${{ secrets.PROD_DEPLOY_PATH }}"
            mkdir -p "${DEPLOY_PATH}/deploy/nginx/certs" "${DEPLOY_PATH}/deploy/nginx/www"
            cd "${DEPLOY_PATH}"

            cat > .env.prod <<EOF_ENV
            APP_DOMAIN="${APP_DOMAIN}"
            API_DOMAIN="${API_DOMAIN}"
            PORTFOLIO_DOMAIN="${PORTFOLIO_DOMAIN}"
            APP_ORIGIN="${APP_ORIGIN}"
            API_ORIGIN="${API_ORIGIN}"
            POSTGRES_DB="${POSTGRES_DB}"
            POSTGRES_USER="${POSTGRES_USER}"
            POSTGRES_PASSWORD="${POSTGRES_PASSWORD}"
            JWT_SECRET="${JWT_SECRET}"
            FILE_SIGNING_SECRET="${FILE_SIGNING_SECRET}"
            MAIL_ENABLED="${MAIL_ENABLED:-false}"
            MAIL_PROVIDER="${MAIL_PROVIDER:-resend}"
            MAIL_DAILY_LIMIT="${MAIL_DAILY_LIMIT:-90}"
            MAIL_FROM_EMAIL="${MAIL_FROM_EMAIL:-onboarding@resend.dev}"
            MAIL_FROM_NAME="${MAIL_FROM_NAME:-SupportOps}"
            RESEND_API_KEY="${RESEND_API_KEY:-}"
            REDIS_PASSWORD="${REDIS_PASSWORD}"
            LOG_LEVEL="${LOG_LEVEL:-info}"
            AUDIT_LOG_RETENTION_DAYS="${AUDIT_LOG_RETENTION_DAYS:-2555}"
            ERROR_ALERT_THRESHOLD="${ERROR_ALERT_THRESHOLD:-20}"
            ERROR_ALERT_WINDOW_MS="${ERROR_ALERT_WINDOW_MS:-300000}"
            ERROR_ALERT_COOLDOWN_MS="${ERROR_ALERT_COOLDOWN_MS:-900000}"
            ERROR_ALERT_WEBHOOK_URL="${ERROR_ALERT_WEBHOOK_URL:-}"
            WEB_IMAGE="${WEB_IMAGE}"
            API_IMAGE="${API_IMAGE}"
            PORTFOLIO_IMAGE="${PORTFOLIO_IMAGE}"
            EOF_ENV

            chmod +x deploy/deploy-prod.sh deploy/smoke-test.sh deploy/init-letsencrypt.sh
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin

            DEPLOY_PATH="${DEPLOY_PATH}" ENV_FILE=.env.prod CERTBOT_EMAIL="${CERTBOT_EMAIL:-}" ./deploy/deploy-prod.sh
