name: CD Staging

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: false
        default: 'develop'

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-staging
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  WEB_IMAGE_NAME: ${{ github.repository_owner }}/supportops-web
  API_IMAGE_NAME: ${{ github.repository_owner }}/supportops-api
  PORTFOLIO_IMAGE_NAME: ${{ github.repository_owner }}/supportops-portfolio

jobs:
  build-web:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache turbo build artifacts
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-web-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-web-

      - name: Set image name
        id: meta
        run: echo "image=${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:staging-${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:staging-latest
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.STAGING_API_ORIGIN }}/api/v1
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  build-api:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache turbo build artifacts
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-api-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-api-

      - name: Set image name
        id: meta
        run: echo "image=${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:staging-${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:staging-latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  build-portfolio:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache turbo build artifacts
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-portfolio-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-portfolio-

      - name: Set image name
        id: meta
        run: echo "image=${{ env.REGISTRY }}/${{ env.PORTFOLIO_IMAGE_NAME }}:staging-${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Build and push portfolio image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/portfolio/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.REGISTRY }}/${{ env.PORTFOLIO_IMAGE_NAME }}:staging-latest
          cache-from: type=gha,scope=portfolio
          cache-to: type=gha,mode=max,scope=portfolio

  deploy:
    runs-on: ubuntu-latest
    needs: [build-web, build-api, build-portfolio]
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy deploy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: "docker-compose.staging.yml,deploy/nginx/templates/supportops.conf.template,deploy/deploy-staging.sh,deploy/smoke-test.sh,deploy/init-letsencrypt.sh"
          target: ${{ secrets.STAGING_DEPLOY_PATH }}
          strip_components: 0
          overwrite: true

      - name: Deploy to staging
        uses: appleboy/ssh-action@v1.2.0
        env:
          WEB_IMAGE: ${{ needs.build-web.outputs.image }}
          API_IMAGE: ${{ needs.build-api.outputs.image }}
          PORTFOLIO_IMAGE: ${{ needs.build-portfolio.outputs.image }}
          PORTFOLIO_DOMAIN: ${{ secrets.STAGING_PORTFOLIO_DOMAIN }}
          APP_DOMAIN: ${{ secrets.STAGING_APP_DOMAIN }}
          API_DOMAIN: ${{ secrets.STAGING_API_DOMAIN }}
          APP_ORIGIN: ${{ secrets.STAGING_APP_ORIGIN }}
          API_ORIGIN: ${{ secrets.STAGING_API_ORIGIN }}
          POSTGRES_DB: ${{ secrets.STAGING_POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.STAGING_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.STAGING_POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
          FILE_SIGNING_SECRET: ${{ secrets.STAGING_FILE_SIGNING_SECRET }}
          GHCR_USERNAME: ${{ secrets.STAGING_GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.STAGING_GHCR_TOKEN }}
          MAIL_ENABLED: ${{ secrets.STAGING_MAIL_ENABLED }}
          MAIL_PROVIDER: ${{ secrets.STAGING_MAIL_PROVIDER }}
          MAIL_DAILY_LIMIT: ${{ secrets.STAGING_MAIL_DAILY_LIMIT }}
          MAIL_FROM_EMAIL: ${{ secrets.STAGING_MAIL_FROM_EMAIL }}
          MAIL_FROM_NAME: ${{ secrets.STAGING_MAIL_FROM_NAME }}
          RESEND_API_KEY: ${{ secrets.STAGING_RESEND_API_KEY }}
          CERTBOT_EMAIL: ${{ secrets.STAGING_CERTBOT_EMAIL }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: WEB_IMAGE,API_IMAGE,PORTFOLIO_IMAGE,PORTFOLIO_DOMAIN,APP_DOMAIN,API_DOMAIN,APP_ORIGIN,API_ORIGIN,POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,JWT_SECRET,FILE_SIGNING_SECRET,GHCR_USERNAME,GHCR_TOKEN,MAIL_ENABLED,MAIL_PROVIDER,MAIL_DAILY_LIMIT,MAIL_FROM_EMAIL,MAIL_FROM_NAME,RESEND_API_KEY,CERTBOT_EMAIL
          script_stop: true
          script: |
            set -Eeuo pipefail
            DEPLOY_PATH="${{ secrets.STAGING_DEPLOY_PATH }}"
            mkdir -p "${DEPLOY_PATH}/deploy/nginx/certs" "${DEPLOY_PATH}/deploy/nginx/www"
            cd "${DEPLOY_PATH}"

            cat > .env.staging <<EOF_ENV
            APP_DOMAIN="${APP_DOMAIN}"
            API_DOMAIN="${API_DOMAIN}"
            PORTFOLIO_DOMAIN="${PORTFOLIO_DOMAIN}"
            APP_ORIGIN="${APP_ORIGIN}"
            API_ORIGIN="${API_ORIGIN}"
            POSTGRES_DB="${POSTGRES_DB}"
            POSTGRES_USER="${POSTGRES_USER}"
            POSTGRES_PASSWORD="${POSTGRES_PASSWORD}"
            JWT_SECRET="${JWT_SECRET}"
            FILE_SIGNING_SECRET="${FILE_SIGNING_SECRET}"
            MAIL_ENABLED="${MAIL_ENABLED:-false}"
            MAIL_PROVIDER="${MAIL_PROVIDER:-resend}"
            MAIL_DAILY_LIMIT="${MAIL_DAILY_LIMIT:-90}"
            MAIL_FROM_EMAIL="${MAIL_FROM_EMAIL:-onboarding@resend.dev}"
            MAIL_FROM_NAME="${MAIL_FROM_NAME:-SupportOps}"
            RESEND_API_KEY="${RESEND_API_KEY:-}"
            WEB_IMAGE="${WEB_IMAGE}"
            API_IMAGE="${API_IMAGE}"
            PORTFOLIO_IMAGE="${PORTFOLIO_IMAGE}"
            EOF_ENV

            chmod +x deploy/deploy-staging.sh deploy/smoke-test.sh deploy/init-letsencrypt.sh
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin

            DEPLOY_PATH="${DEPLOY_PATH}" ENV_FILE=.env.staging CERTBOT_EMAIL="${CERTBOT_EMAIL:-}" ./deploy/deploy-staging.sh
