name: CD Staging

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-staging
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  WEB_IMAGE_NAME: ${{ github.repository_owner }}/supportops-web
  API_IMAGE_NAME: ${{ github.repository_owner }}/supportops-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      web_image: ${{ steps.meta.outputs.web_image }}
      api_image: ${{ steps.meta.outputs.api_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build metadata
        id: meta
        run: |
          WEB_IMAGE="${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:staging-${GITHUB_SHA}"
          API_IMAGE="${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:staging-${GITHUB_SHA}"
          echo "web_image=${WEB_IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "api_image=${API_IMAGE}" >> "${GITHUB_OUTPUT}"

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.web_image }}
            ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:staging-latest

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.api_image }}
            ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:staging-latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy deploy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: "docker-compose.staging.yml,deploy/nginx/templates/supportops.conf.template,deploy/deploy-staging.sh,deploy/smoke-test.sh"
          target: ${{ secrets.STAGING_DEPLOY_PATH }}
          strip_components: 0
          overwrite: true

      - name: Deploy to staging
        uses: appleboy/ssh-action@v1.2.0
        env:
          WEB_IMAGE: ${{ needs.build-and-push.outputs.web_image }}
          API_IMAGE: ${{ needs.build-and-push.outputs.api_image }}
          APP_DOMAIN: ${{ secrets.STAGING_APP_DOMAIN }}
          API_DOMAIN: ${{ secrets.STAGING_API_DOMAIN }}
          APP_ORIGIN: ${{ secrets.STAGING_APP_ORIGIN }}
          API_ORIGIN: ${{ secrets.STAGING_API_ORIGIN }}
          POSTGRES_DB: ${{ secrets.STAGING_POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.STAGING_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.STAGING_POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
          FILE_SIGNING_SECRET: ${{ secrets.STAGING_FILE_SIGNING_SECRET }}
          GHCR_USERNAME: ${{ secrets.STAGING_GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.STAGING_GHCR_TOKEN }}
          MAIL_ENABLED: ${{ secrets.STAGING_MAIL_ENABLED }}
          MAIL_PROVIDER: ${{ secrets.STAGING_MAIL_PROVIDER }}
          MAIL_DAILY_LIMIT: ${{ secrets.STAGING_MAIL_DAILY_LIMIT }}
          MAIL_FROM_EMAIL: ${{ secrets.STAGING_MAIL_FROM_EMAIL }}
          MAIL_FROM_NAME: ${{ secrets.STAGING_MAIL_FROM_NAME }}
          RESEND_API_KEY: ${{ secrets.STAGING_RESEND_API_KEY }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: WEB_IMAGE,API_IMAGE,APP_DOMAIN,API_DOMAIN,APP_ORIGIN,API_ORIGIN,POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,JWT_SECRET,FILE_SIGNING_SECRET,GHCR_USERNAME,GHCR_TOKEN,MAIL_ENABLED,MAIL_PROVIDER,MAIL_DAILY_LIMIT,MAIL_FROM_EMAIL,MAIL_FROM_NAME,RESEND_API_KEY
          script_stop: true
          script: |
            set -Eeuo pipefail
            DEPLOY_PATH="${{ secrets.STAGING_DEPLOY_PATH }}"
            mkdir -p "${DEPLOY_PATH}/deploy/nginx/certs" "${DEPLOY_PATH}/deploy/nginx/www"
            cd "${DEPLOY_PATH}"

            cat > .env.staging <<EOF_ENV
            APP_DOMAIN=${APP_DOMAIN}
            API_DOMAIN=${API_DOMAIN}
            APP_ORIGIN=${APP_ORIGIN}
            API_ORIGIN=${API_ORIGIN}
            POSTGRES_DB=${POSTGRES_DB}
            POSTGRES_USER=${POSTGRES_USER}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            JWT_SECRET=${JWT_SECRET}
            FILE_SIGNING_SECRET=${FILE_SIGNING_SECRET}
            MAIL_ENABLED=${MAIL_ENABLED:-false}
            MAIL_PROVIDER=${MAIL_PROVIDER:-resend}
            MAIL_DAILY_LIMIT=${MAIL_DAILY_LIMIT:-90}
            MAIL_FROM_EMAIL=${MAIL_FROM_EMAIL:-onboarding@resend.dev}
            MAIL_FROM_NAME=${MAIL_FROM_NAME:-SupportOps}
            RESEND_API_KEY=${RESEND_API_KEY:-}
            WEB_IMAGE=${WEB_IMAGE}
            API_IMAGE=${API_IMAGE}
            EOF_ENV

            chmod +x deploy/deploy-staging.sh deploy/smoke-test.sh
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin

            DEPLOY_PATH="${DEPLOY_PATH}" ENV_FILE=.env.staging ./deploy/deploy-staging.sh
